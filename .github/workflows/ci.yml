name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push or pull request run supersedes the one before it; a tag run
# publishes a release, so it is never cancelled by a later push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - name: Build
        run: go build ./...
      - name: Cross-compile for the desktop platforms
        run: |
          GOOS=darwin go build ./...
          GOOS=windows go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: CGO_ENABLED=0 go test ./...

  windows:
    name: Test on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Formatting is checked on Linux: a Windows checkout rewrites the
      # files with CRLF, which gofmt reports as unformatted.
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      # Cross-compiling only says the code builds for Windows. Starting the
      # binary says it runs there: a missing DLL or a crash on window
      # creation shows up as an early exit.
      - name: Launch the app
        shell: pwsh
        run: |
          go build -o mygo-demo.exe .
          $app = Start-Process -FilePath .\mygo-demo.exe -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) {
            throw "mygo-demo exited with code $($app.ExitCode)"
          }
          $app.Kill()
          "mygo-demo started and stayed up"

  build:
    name: ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build the apps
        env:
          # Signs the update manifests and archives; without it the build
          # skips them, and installed apps would have nothing to update to.
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bun run build -- -platform "${{ matrix.platform }}"
      # Artifacts expire with the run; a v* tag also turns them into a
      # release, in the job below.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            build/*/*.dmg
            build/*/*-setup-*.exe
            build/*/*.deb
            build/*/*.tar.gz
            build/*/*.delta
            build/*/update-*.json

  release:
    name: Release
    needs: build
    # Every tag: a stable tag is the latest release, so only it may publish
    # without --prerelease. A tag without the key makes no updates at all,
    # and this job says so instead of shipping installers that cannot update.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The installers carry the version from mygo.config.ts, so a tag that
      # disagrees would publish files named after a different release. A
      # prerelease tag (v0.1.0-beta.1) matches the same base version.
      - name: Check the tag against mygo.config.ts
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(sed -n 's/.*version: "\(.*\)".*/\1/p' mygo.config.ts)
          if [ "${want%%-*}" != "${got%%-*}" ]; then
            echo "tag $GITHUB_REF_NAME does not match version \"$got\" in mygo.config.ts"
            exit 1
          fi
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Check that the updates were signed
        run: |
          if [ -z "$(find dist -name 'update-*.json' -print -quit)" ]; then
            echo "no update-*.json in the artifacts: MYGO_UPDATER_PRIVATE_KEY is unset"
            exit 1
          fi
      - name: List the assets
        run: find dist -type f | sort
      # Tags with a hyphen, such as v0.1.0-beta.1, publish as prereleases.
      # Re-running a tag replaces its assets instead of failing.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          mapfile -t files < <(find dist -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no artifacts to publish"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            exit 0
          fi
          # A stable tag becomes the latest release, whose manifests every
          # installed app checks; a hyphenated one stays a prerelease.
          extra=()
          case "$tag" in *-*) extra+=(--prerelease) ;; esac
          gh release create "$tag" "${files[@]}" --title "$tag" --generate-notes "${extra[@]}"

